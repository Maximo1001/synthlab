# nginx delante de SYNTHLAB: TLS, límites, rate-limit de borde y cabeceras.
limit_req_zone $binary_remote_addr zone=sl_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=sl_api:10m rate=20r/s;

upstream synthlab { server synthlab:8000; keepalive 16; }   # systemd: 127.0.0.1:8000

server {
    listen 80;
    server_name synthlab.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name synthlab.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    # Formato que leen las reglas de Wazuh (decoder web-accesslog)
    access_log /var/log/nginx/synthlab.access.log;

    location ~ /\. { deny all; }

    location /static/ {
        proxy_pass http://synthlab;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /api/auth/ {
        limit_req zone=sl_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_pass http://synthlab;
    }

    location / {
        limit_req zone=sl_api burst=40 nodelay;
        limit_req_status 429;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;   # sobrescribe, no concatena
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://synthlab;
    }
}
